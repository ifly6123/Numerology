<div class="container" id="app">
    <div class="brand-header">
        <h1>Your Daily <span>Rhythms</span></h1>
        <p>Rough energy windows through the day, plus a general look at wealth channels.</p>
    </div>
</div>

<script src="engine-data.js"></script>
<script src="engine-content.js"></script>
<script src="engine-ui.js"></script>
<script>
const p = requireProfileOrRedirect();
if (p) {
    const el = document.getElementById('app');
    const c = CIRCADIAN_SIMPLE[safeDigit(p.mulank)] || CIRCADIAN_SIMPLE[1];

    const circPanel = document.createElement('div');
    circPanel.className = 'panel';
    circPanel.innerHTML = `
        <div class="elem-card-top"><h2 style="margin:0;">Your Hourly Energy Windows</h2><button class="info-btn" aria-label="Learn more" onclick="openInfo('circadian')">i</button></div>
        <div class="elem-card" style="margin-top:1rem; border-left:4px solid #10b981;">
            <div class="elem-title">🟢 Peak Window</div><div class="elem-desc">${c.peak}</div>
        </div>
        <div class="elem-card" style="border-left:4px solid #f59e0b;">
            <div class="elem-title">🟡 Good Flow Window</div><div class="elem-desc">${c.secondary}</div>
        </div>
        <div class="elem-card" style="border-left:4px solid #ef4444;">
            <div class="elem-title">🔴 Low Energy Window</div><div class="elem-desc">${c.caution}</div>
        </div>
        ${saveButtonHTML('My Hourly Energy Windows', `Peak: ${c.peak} Good flow: ${c.secondary} Low energy: ${c.caution}`, 'rhythms.html')}`;
    el.appendChild(circPanel);

    // Asset allocation
    const hasSilver = p.gridCounts[2] > 0 && p.gridCounts[5] > 0 && p.gridCounts[8] > 0;
    const hasPractical = p.gridCounts[8] > 0 && p.gridCounts[1] > 0 && p.gridCounts[6] > 0;
    const missing58 = !(p.gridCounts[5] > 0) || !(p.gridCounts[8] > 0);
    const notes = [];
    if (hasSilver) notes.push("<strong>Property & physical assets:</strong> Your numbers show a strong pattern here, suggesting a natural fit with real estate, land, or holding physical assets.");
    if (hasPractical) notes.push("<strong>Structured investments:</strong> Your numbers suggest steady, structured options like long-term stocks or bonds may suit you better than quick, risky moves.");
    if (missing58) notes.push("<strong>Go easy on high risk:</strong> With these particular numbers light in your chart, very speculative moves (day-trading, for example) may carry extra risk for you. Steady, automated saving tends to suit you better.");
    if (notes.length === 0) notes.push("<strong>Balanced approach:</strong> Your chart doesn't lean strongly any one way, which suits a mixed, diversified approach.");

    const assetPanel = document.createElement('div');
    assetPanel.className = 'panel';
    assetPanel.innerHTML = `
        <div class="elem-card-top"><h2 style="margin:0;">A General Look At Wealth Channels</h2><button class="info-btn" aria-label="Learn more" onclick="openInfo('assetAllocation')">i</button></div>
        ${notes.map(n => `<div class="elem-card" style="margin-top:1rem;"><div class="elem-desc">${n}</div></div>`).join('')}
        <p class="notice" style="margin-top:1.2rem;">This is a light, general reflection only — always talk to a real financial advisor before making investment decisions.</p>`;
    el.appendChild(assetPanel);
}
</script>
